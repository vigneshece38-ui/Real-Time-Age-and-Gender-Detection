<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Age & Gender Detection</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for a cleaner look */
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
        }
        .video-container {
            background-color: #1a202c; /* Dark background for video */
            border: 1px solid #4a5568;
            width: 70%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }
        @media (max-width: 640px) {
            .video-container {
                width: 100%;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" 
    rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
<div class="container mx-auto p-4 md:p-8">
    <header class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-bold text-cyan-400">Age & Gender Detection</h1>
        <p class="text-lg text-gray-400 mt-2">Live Analysis via Webcam</p>
    </header>
    <div class="bg-gray-800 p-6 m-5 rounded-xl shadow-2xl">
        <h2 class="text-2xl font-semibold mb-4 text-center border-b border-gray-700 pb-2">Live Webcam Feed</h2>
        <div class="video-container rounded-lg overflow-hidden mx-auto">
            <img src="{{ url_for('video_feed') }}" style="width:100%;" alt="Webcam Feed">
        </div>
        <p class="text-center text-gray-500 mt-4 text-sm">Your webcam feed is processed in real-time. No data is stored.</p>
    </div>
    <footer class="text-center mt-12 text-gray-500 text-sm">
        <p>Project based on the paper "Real-time Gender and Age Detection from Facial Images".</p>
    </footer>
</div>
</body>
</html>
